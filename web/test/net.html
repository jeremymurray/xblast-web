<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="importmap">
{"imports":{
  "@trystero-p2p/nostr":"../vendor/trystero/nostr/index.mjs",
  "@trystero-p2p/core":"../vendor/trystero/core/index.mjs",
  "@noble/secp256k1":"../vendor/trystero/noble/index.js"
}}
</script>
<title>XBlast net.js transport test</title>
<style>
  body { background: #111; color: #ddd; font: 13px/1.5 monospace; padding: 1em; }
  h1 { font-size: 1.1em; color: #ffd400; }
  #lines { white-space: pre-wrap; }
  .ok { color: #6f6; }
  .bad { color: #f66; }
</style>
</head>
<body>
<h1>XBlast net.js transport test</h1>
<div id="meta"></div>
<div id="lines"></div>
<script>
  /*
   * Test-only page for web/net.js. The Python harness drives the steps;
   * this page only exposes serialisable wrappers and the run state.
   */
  const params = new URLSearchParams(location.search);
  const role = params.get('role') === 'client' ? 'client' : 'host';
  const room = params.get('room') || 'test-room';
  const scenario = params.get('scenario') || 'basic';
  /* Test-only: drive the per-tab id so two pages can simulate one tab's
     refresh. A real page keeps this value in sessionStorage. */
  const fixedClientId = params.get('clientId');
  if (fixedClientId) {
    try { sessionStorage.setItem('xb:clientId', fixedClientId); } catch (e) { /* private mode */ }
  }

  const T = {
    role, room, scenario,
    ready: false, done: false, ok: false, lines: [], error: null,
    log(line) {
      this.lines.push(String(line));
      const el = document.getElementById('lines');
      if (el) el.textContent = this.lines.join('\n');
      console.log('xbtest:', line);
    },
    finish(ok, error) {
      this.ok = !!ok;
      this.error = error ? String(error) : null;
      this.done = true;
      this.log(ok ? 'PASS' : 'FAIL: ' + this.error);
    },
    check(name, condition) {
      if (!condition) throw new Error(name);
      this.log('ok: ' + name);
    },
    requireNet() {
      const net = globalThis.XBNet;
      if (!net) throw new Error('XBNet is undefined');
      return net;
    },
    recv(fd, max) {
      const r = this.requireNet().recv(fd, max);
      if (r && r.kind === 'data') return {kind: 'data', data: Array.from(r.data)};
      return {kind: r ? r.kind : 'error'};
    },
    send(fd, bytes) { return this.requireNet().send(fd, Uint8Array.from(bytes)); },
    open(fd, kind) { this.requireNet().open(fd, kind); return true; },
    listen(fd, room_) { return this.requireNet().listen(fd, room_); },
    connect(fd, room_) { this.requireNet().connect(fd, room_); return this.requireNet().connectState(fd); },
    connectState(fd) { return this.requireNet().connectState(fd); },
    cancelConnect(fd) { this.requireNet().cancelConnect(fd); return true; },
    accept(listenFd, newFd) { return this.requireNet().accept(listenFd, newFd); },
    attachPeer(fd, peer) { return this.requireNet().attachPeer(fd, peer); },
    shutdownWrite(fd) { this.requireNet().shutdownWrite(fd); return true; },
    closeFd(fd) { this.requireNet().close(fd); return true; },
    status() { return this.requireNet().status(); },
    stats() { return this.requireNet().stats(); },
    peerIds() { return this.requireNet().peerIds(); },
    localName(fd) { return this.requireNet().localName(fd); },
    remoteName(fd) { return this.requireNet().remoteName(fd); },
    localPort(fd) { return this.requireNet().localPort(fd); },
    remotePort(fd) { return this.requireNet().remotePort(fd); },
    configure(opts) { this.requireNet().configure(opts); return true; },
    leave() { this.requireNet().leave(); return true; },
  };
  globalThis.__test = T;
  document.getElementById('meta').textContent =
    `role=${role} room=${room} scenario=${scenario}`;
</script>
<script type="module">
  const T = globalThis.__test;
  try {
    // Importing first makes a missing/blocked net.js visible as a module
    // error instead of an obscure "undefined" during the scenario.
    await import('../net.js');
    const XB = globalThis.XBNet;
    if (!XB) throw new Error('XBNet is undefined after importing ../net.js');

    if (T.scenario === 'turn-config') {
      try {
        const turn = await import('../turn.js');
        const cfg = (urls, username = 'u', credential = 'p') =>
          ({ urls, username, credential });
        T.check('accepts turn url', turn.normalizeTurnConfig([
          cfg('turn:relay.example.org:3478?transport=udp')]).length === 1);
        T.check('accepts turns url', turn.normalizeTurnConfig([
          cfg('turns:relay.example.org:5349')]).length === 1);
        T.check('accepts multiple urls', turn.normalizeTurnConfig([
          cfg(['turn:relay.example.org:3478', 'turns:relay.example.org:5349'])]).length === 1);
        T.check('rejects stun', turn.normalizeTurnConfig([
          cfg('stun:stun.example.org:3478')]).length === 0);
        T.check('rejects embedded userinfo', turn.normalizeTurnConfig([
          cfg('turn:user:pass@relay.example.org:3478')]).length === 0);
        T.check('rejects bad port', turn.normalizeTurnConfig([
          cfg('turn:relay.example.org:99999')]).length === 0);
        T.check('rejects missing credential', turn.normalizeTurnConfig([
          { urls: 'turn:relay.example.org:3478', username: 'u', credential: '' }]).length === 0);
        T.check('drops only invalid entries', turn.normalizeTurnConfig([
          cfg('stun:stun.example.org:3478'), cfg('turn:relay.example.org:3478')]).length === 1);
        T.check('non-array is empty', turn.normalizeTurnConfig('nope').length === 0);

        const fakeFetch = (responses) => async (url) => {
          const hit = responses[String(url)];
          if (!hit) return { ok: false, status: 404, json: async () => ({}) };
          if (hit.throw) throw new Error('network down');
          return { ok: true, status: 200, json: async () => hit.body };
        };

        const staticFile = { turnConfig: [cfg('turn:relay.example.org:3478')] };
        T.check('parses static file', turn.parseTurnFile(staticFile).turnConfig.length === 1);
        T.check('parses endpoint file', turn.parseTurnFile(
          { credentialsUrl: '/turn-credentials' }, { baseUrl: 'https://game.example/' }
        ).credentialsUrl === 'https://game.example/turn-credentials');
        T.check('rejects http endpoint', turn.parseTurnFile(
          { credentialsUrl: 'http://evil.example/creds' }, { baseUrl: 'https://game.example/' }
        ).credentialsUrl === null);

        const missing = await turn.loadTurnFile({
          fetchImpl: fakeFetch({}), url: '/turn.json', timeoutMs: 50,
        });
        T.check('missing file is empty', missing.turnConfig.length === 0 && !!missing.warning);
        const loaded = await turn.loadTurnFile({
          fetchImpl: fakeFetch({ '/turn.json': { body: staticFile } }),
          url: '/turn.json', timeoutMs: 50,
        });
        T.check('loads static file', loaded.turnConfig.length === 1);

        const endpoint = await turn.fetchCredentials('https://game.example/creds', {
          fetchImpl: fakeFetch({
            'https://game.example/creds': { body: { turnConfig: [cfg('turns:relay.example.org:5349')] } },
          }), timeoutMs: 50,
        });
        T.check('endpoint response', endpoint.turnConfig.length === 1);

        const viaEndpoint = await turn.resolveTurnConfig({
          file: { turnConfig: [], credentialsUrl: 'https://game.example/creds' },
          fetchImpl: fakeFetch({
            'https://game.example/creds': { body: { turnConfig: [cfg('turns:relay.example.org:5349')] } },
          }), timeoutMs: 50,
        });
        T.check('resolves endpoint', viaEndpoint.source === 'endpoint');
        const fallback = await turn.resolveTurnConfig({
          file: { turnConfig: [cfg('turn:relay.example.org:3478')],
                  credentialsUrl: 'https://game.example/creds' },
          fetchImpl: fakeFetch({ 'https://game.example/creds': { throw: true } }), timeoutMs: 50,
        });
        T.check('falls back to file', fallback.source === 'file');
        const override = await turn.resolveTurnConfig({
          file: { turnConfig: [cfg('turn:file.example.org:3478')], credentialsUrl: null },
          playerOverride: [cfg('turn:mine.example.org:3478')], timeoutMs: 50,
        });
        T.check('player wins', override.source === 'player');

        T.ready = true;
        T.finish(true);
      } catch (e) {
        T.ready = true;
        T.finish(false, e);
      }
    } else if (T.scenario === 'wrong-room') {
      XB.configure({connectTimeoutMs: 500});
      XB.enter(T.role, T.room);
      XB.open(301, 'stream');
      T.connectAt = performance.now();
      XB.connect(301);
    } else {
      XB.enter(T.role, T.room);
    }
    T.ready = true;
    T.log(`session ready: role=${T.role} room=${T.room} self=${XB.status().selfId}`);
  } catch (e) {
    T.error = e && e.message ? e.message : String(e);
    T.log('module failure: ' + T.error);
  }
</script>
</body>
</html>
